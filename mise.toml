[tools]
"aqua:JohnnyMorganz/StyLua" = "v2.5.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "v3.13.1"
"aqua:neovim/neovim" = "0.12.5"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:tamasfe/taplo" = "0.10.0"
lua-language-server = "3.18.2"
node = "24.16.0"
"npm:lefthook" = "2.1.9"
"npm:prettier" = "3.8.3"

[tasks.test]
description = "Run the tests"
run = [
  "test -d deps/mini.test || git clone --quiet --config advice.detachedHead=false --depth 1 --branch v0.18.0 https://github.com/nvim-mini/mini.test deps/mini.test",
  "test -d deps/luacov || git clone --quiet --config advice.detachedHead=false --depth 1 --branch v0.17.0 https://github.com/lunarmodules/luacov deps/luacov",
  "rm -f coverage/luacov.stats.out",
  "nvim --headless --noplugin -u scripts/minimal_init.lua -c 'lua MiniTest.run()'",
]
