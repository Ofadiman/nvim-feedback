pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: stylua
      glob: "*.lua"
      run: stylua {staged_files}
      stage_fixed: true

    - name: lua_ls
      run: lua-language-server --check=. --checklevel=Warning

    - name: prettier
      run: prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: taplo
      glob: "*.toml"
      run: taplo format {staged_files}
      stage_fixed: true

    - name: shfmt
      file_types: text/x-sh
      run: shfmt --write {staged_files}
      stage_fixed: true

    - name: shellcheck
      file_types: text/x-sh
      run: shellcheck --severity=style --exclude=SC1071 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*"
      run: actionlint
