pre-commit:
  parallel: true
  skip: [merge, rebase]
  jobs:
    - name: stylua
      glob: "*.lua"
      run: stylua {staged_files}
      stage_fixed: true

    - name: lua_ls
      run: lua-language-server --check=. --checklevel=Warning

    - name: prettier
      glob: "*.{md,json,yaml,yml}"
      run: prettier --write {staged_files}
      stage_fixed: true

    - name: taplo
      glob: "*.toml"
      run: taplo format {staged_files}
      stage_fixed: true

    - name: shfmt
      glob: "*.sh"
      run: shfmt --write {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
